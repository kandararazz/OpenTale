<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTale — Interactive Digital Storybook Platform</title>
    <meta name="description" content="A modern, cozy digital storybook platform featuring interactive flip-books, speech narration, vocabulary tooltips, and gamified reading streaks." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ff7b54" />
  </head>
  <body class="bg-cozy-bg text-cozy-text font-sans antialiased selection:bg-peach-200 selection:text-peach-600 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        });
      }
    </script>
  </body>
</html>
